<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">E-MIND overview: DE_CENT and ES_MED</title>
<desc id="desc">Two scientifically validated 2019–2025 scenarios compose heterogeneous spatial supports, not measured co-located microgrids. DE_CENT: ERA5 weather, SMARD load, SMARD market, EC Weekly Oil Bulletin fuel. ES_MED: ERA5 weather, REData load, OMIE market, EC Weekly Oil Bulletin fuel. Current E-MIND Data preserves independent scenario identities. A future authorised scientific package contains hourly.parquet with weather, load and market, a native weekly fuel component, metadata, provenance, validation and checksums. The archival scientific release is NOT_ISSUED; REData and OMIE redistribution is PENDING. Public source contains code, docs, tests and safe metadata/configuration, without scientific payloads. E-MIND Env, Reference Tasks and Configurator are future, not implemented. Researchers supply their own plant and controller.</desc>
